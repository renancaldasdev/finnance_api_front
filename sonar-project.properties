# SonarQube configuration for Finannce API Frontend
sonar.projectKey=finannce_api_front
sonar.projectName=Finannce API Frontend
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Source code location
sonar.sources=app
sonar.exclusions=**/__tests__/**,**/node_modules/**,.nuxt/**,.output/**
sonar.tests=app
sonar.test.inclusions=**/__tests__/**

# TypeScript configuration
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# Code quality thresholds
sonar.qualitygate.wait=false
sonar.qualitygate.timeout=300

# Coverage settings
sonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts,**/vitest.setup.ts

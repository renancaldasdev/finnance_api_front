<!-- @dsCard group="Dados" height=176 -->
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="../../tokens.css" />
    <link rel="stylesheet" href="../bundle.css" />
    <title>KpiCard</title>
  </head>
  <body>
    <div class="fn-row" style="align-items: stretch">
      <div class="fn-kpi fn-kpi-hero">
        <span class="fn-kpi-label">Saldo em contas</span
        ><span class="fn-kpi-value">R$ 24.860,40</span
        ><span class="fn-kpi-meta">3 contas ativas</span>
      </div>
      <div class="fn-kpi">
        <span class="fn-kpi-label">Receitas do mês</span
        ><span class="fn-kpi-value" style="color: var(--income)">R$ 9.450,00</span
        ><span class="fn-kpi-meta">3 lançamentos</span>
      </div>
      <div class="fn-kpi">
        <span class="fn-kpi-label">Em aberto</span
        ><span class="fn-kpi-value" style="color: var(--warning)">R$ 2.102,30</span>
        <div class="fn-progress" aria-hidden="true"><span style="width: 22%"></span></div>
      </div>
    </div>
  </body>
</html>

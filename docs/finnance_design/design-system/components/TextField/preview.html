<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="../../tokens.css" />
    <link rel="stylesheet" href="../bundle.css" />
    <title>TextField</title>
  </head>
  <body>
    <div class="fn-row" style="align-items: flex-start">
      <label class="fn-field"
        >Descrição
        <input class="fn-input" type="text" placeholder="Ex.: Supermercado" />
      </label>
      <label class="fn-field"
        >Conta
        <select class="fn-input">
          <option>Nubank</option>
          <option>Itaú</option>
        </select>
      </label>
      <label class="fn-field fn-field-error"
        >Nome
        <input class="fn-input" type="text" value="It" aria-invalid="true" />
        <span class="fn-field-hint">O nome precisa ter pelo menos 3 caracteres.</span>
      </label>
    </div>
  </body>
</html>

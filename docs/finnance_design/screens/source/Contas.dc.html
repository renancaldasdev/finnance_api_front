<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Finannce — Contas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F5F2}
a{color:#0B6B51}a:hover{color:#08513D}
</style>
</helmet>
<div style="font-family: Manrope, system-ui, sans-serif; color: #0F1A17; background: #F4F5F2; min-height: 100vh; display: flex; flex-wrap: wrap; font-variant-numeric: tabular-nums">

<nav aria-label="Menu principal" style="flex: 1 1 240px; max-width: 100%; box-sizing: border-box; background: #0F1A17; color: #E7ECE9; padding: 28px 18px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 10px">
<div style="width: 34px; height: 34px; border-radius: 10px; background: #0B7A5C; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"></path><path d="M10 20V4"></path><path d="M16 20v-7"></path><path d="M22 20H2"></path></svg></div>
<span style="font-size: 20px; font-weight: 800; letter-spacing: -0.02em">finannce</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; color: #B9C4BF; text-decoration: none; font-weight: 600; font-size: 14px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg>Visão geral</a>
<a href="Transacoes.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; color: #B9C4BF; text-decoration: none; font-weight: 600; font-size: 14px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16"></path><path d="M3 8l4-4 4 4"></path><path d="M17 20V4"></path><path d="M21 16l-4 4-4-4"></path></svg>Transações</a>
<a href="Contas.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; background: #1F2E29; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 14px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-6 9 6"></path><path d="M5 10v9"></path><path d="M19 10v9"></path><path d="M9.5 10v9"></path><path d="M14.5 10v9"></path><path d="M3 21h18"></path></svg>Contas</a>
<a href="Categorias.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; color: #B9C4BF; text-decoration: none; font-weight: 600; font-size: 14px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"></path><circle cx="8" cy="8" r="1.5"></circle></svg>Categorias</a>
</div>
<div style="margin-top: auto; display: flex; align-items: center; gap: 12px; padding: 10px 6px 10px 12px; border-radius: 12px; background: #17241F">
<div aria-hidden="true" style="width: 36px; height: 36px; border-radius: 50%; background: #2C3D37; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px">R</div>
<a href="#" style="display: flex; flex-direction: column; flex: 1; min-width: 0; color: #E7ECE9; text-decoration: none"><span style="font-size: 14px; font-weight: 700">Renan Caldas</span><span style="font-size: 12px; color: #A7B3AE">Editar perfil</span></a>
<a href="Login.dc.html" aria-label="Sair" style="width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #B9C4BF"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg></a>
</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px clamp(16px, 3vw, 40px) 48px; display: flex; flex-direction: column; gap: 24px">

<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 14px; color: #5B6661; font-weight: 600">Saldo somado: R$ 24.860,40</span>
<h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em">Contas</h1>
</div>
<a href="NovaTransacao.dc.html" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 1px solid #D6DBD8; border-radius: 10px; background: #FFFFFF; color: #0F1A17; text-decoration: none; font-size: 14px; font-weight: 700"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4-4 4"></path><path d="M21 7H9"></path><path d="M7 21l-4-4 4-4"></path><path d="M3 17h12"></path></svg>Transferir entre contas</a>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">

<section aria-label="Suas contas" style="flex: 999 1 520px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px">
<sc-for list="{{accounts}}" as="a" hint-placeholder-count="3">
<article style="background: #FFFFFF; border: 1px solid #E2E6E3; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px; min-width: 0">
<div aria-hidden="true" style="width: 44px; height: 44px; border-radius: 12px; background: #EEF3F1; color: #0B6B51; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px">{{a.initials}}</div>
<div style="display: flex; flex-direction: column; min-width: 0"><h2 style="margin: 0; font-size: 16px; font-weight: 800">{{a.name}}</h2><span style="{{a.badgeStyle}}">{{a.type}}</span></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 700; color: #5B6661; text-transform: uppercase; letter-spacing: 0.04em">Saldo</span>
<span style="font-size: 26px; font-weight: 800; letter-spacing: -0.02em">{{a.balance}}</span>
</div>
<div style="display: flex; gap: 8px; border-top: 1px solid #F0F2F0; padding-top: 12px">
<a href="Transacoes.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 10px; background: #F4F5F2; text-decoration: none; font-size: 13px; font-weight: 700">Ver extrato</a>
<button type="button" aria-label="Editar conta" style="width: 44px; height: 44px; border: 1px solid #E2E6E3; border-radius: 10px; background: #FFFFFF; color: #3F4A45; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg></button>
<button type="button" aria-label="Excluir conta" style="width: 44px; height: 44px; border: 1px solid #E2E6E3; border-radius: 10px; background: #FFFFFF; color: #9A3B0C; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 14H6L5 6"></path></svg></button>
</div>
</article>
</sc-for>
</section>

<form aria-labelledby="new-acc" style="flex: 1 1 300px; min-width: 0; background: #FFFFFF; border: 1px solid #E2E6E3; border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 16px">
<h2 id="new-acc" style="margin: 0; font-size: 17px; font-weight: 800">Nova conta</h2>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; font-weight: 700; color: #3F4A45">Nome
<input type="text" minlength="3" maxlength="255" placeholder="Ex.: Inter" style="min-height: 44px; padding: 0 14px; border: 1px solid #D6DBD8; border-radius: 10px; font: inherit; font-size: 15px; font-weight: 500; color: #0F1A17">
</label>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="font-size: 13px; font-weight: 700; color: #3F4A45; margin-bottom: 8px">Tipo</legend>
<label style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border: 1px solid #0B7A5C; border-radius: 10px; background: #F1F8F5; font-size: 14px; font-weight: 600; cursor: pointer"><input type="radio" name="acc-type" checked="" style="accent-color: #0B7A5C">Conta corrente</label>
<label style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border: 1px solid #D6DBD8; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer"><input type="radio" name="acc-type" style="accent-color: #0B7A5C">Poupança</label>
<label style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border: 1px solid #D6DBD8; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer"><input type="radio" name="acc-type" style="accent-color: #0B7A5C">Investimento</label>
</fieldset>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; font-weight: 700; color: #3F4A45">Saldo inicial
<span style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border: 1px solid #D6DBD8; border-radius: 10px"><span style="font-weight: 700; color: #5B6661">R$</span><input type="text" inputmode="decimal" placeholder="0,00" style="border: 0; outline: none; font: inherit; font-size: 15px; font-weight: 600; flex: 1; min-width: 0; color: #0F1A17; background: transparent"></span>
</label>
<button type="submit" style="min-height: 46px; border: 0; border-radius: 10px; background: #0B7A5C; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 800; cursor: pointer">Criar conta</button>
</form>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const badge = (bg, fg) => 'align-self: flex-start; margin-top: 4px; padding: 3px 9px; border-radius: 99px; font-size: 12px; font-weight: 700; background: ' + bg + '; color: ' + fg;
    const accounts = [
      { initials: 'NU', name: 'Nubank', type: 'Conta corrente', balance: 'R$ 6.320,15', badgeStyle: badge('#EEF0F7', '#2E3A75') },
      { initials: 'IT', name: 'Itaú', type: 'Conta corrente', balance: 'R$ 3.140,25', badgeStyle: badge('#EEF0F7', '#2E3A75') },
      { initials: 'PP', name: 'Poupança Caixa', type: 'Poupança', balance: 'R$ 0,00', badgeStyle: badge('#FDF0E3', '#7A4400') },
      { initials: 'CDB', name: 'Reserva CDB', type: 'Investimento', balance: 'R$ 15.400,00', badgeStyle: badge('#E3F2EC', '#0A5F48') }
    ];
    return { accounts };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Finannce — Categorias</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
          href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap"
          rel="stylesheet"
        />
        <style>
          body {
            margin: 0;
            background: #f4f5f2;
          }
          a {
            color: #0b6b51;
          }
          a:hover {
            color: #08513d;
          }
        </style>
      </helmet>
      <div
        style="
          font-family: Manrope, system-ui, sans-serif;
          color: #0f1a17;
          background: #f4f5f2;
          min-height: 100vh;
          display: flex;
          flex-wrap: wrap;
        "
      >
        <nav
          aria-label="Menu principal"
          style="
            flex: 1 1 240px;
            max-width: 100%;
            box-sizing: border-box;
            background: #0f1a17;
            color: #e7ece9;
            padding: 28px 18px;
            display: flex;
            flex-direction: column;
            gap: 28px;
          "
        >
          <div style="display: flex; align-items: center; gap: 10px; padding: 0 10px">
            <div
              style="
                width: 34px;
                height: 34px;
                border-radius: 10px;
                background: #0b7a5c;
                display: flex;
                align-items: center;
                justify-content: center;
              "
            >
              <svg
                aria-hidden="true"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#FFFFFF"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M4 20V10"></path>
                <path d="M10 20V4"></path>
                <path d="M16 20v-7"></path>
                <path d="M22 20H2"></path>
              </svg>
            </div>
            <span style="font-size: 20px; font-weight: 800; letter-spacing: -0.02em">finannce</span>
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <a
              href="Main.dc.html"
              style="
                display: flex;
                align-items: center;
                gap: 12px;
                min-height: 44px;
                padding: 0 12px;
                border-radius: 10px;
                color: #b9c4bf;
                text-decoration: none;
                font-weight: 600;
                font-size: 14px;
              "
              ><svg
                aria-hidden="true"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="3" width="7" height="9" rx="1.5"></rect>
                <rect x="14" y="3" width="7" height="5" rx="1.5"></rect>
                <rect x="14" y="12" width="7" height="9" rx="1.5"></rect>
                <rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg
              >Visão geral</a
            >
            <a
              href="Transacoes.dc.html"
              style="
                display: flex;
                align-items: center;
                gap: 12px;
                min-height: 44px;
                padding: 0 12px;
                border-radius: 10px;
                color: #b9c4bf;
                text-decoration: none;
                font-weight: 600;
                font-size: 14px;
              "
              ><svg
                aria-hidden="true"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M7 4v16"></path>
                <path d="M3 8l4-4 4 4"></path>
                <path d="M17 20V4"></path>
                <path d="M21 16l-4 4-4-4"></path></svg
              >Transações</a
            >
            <a
              href="Contas.dc.html"
              style="
                display: flex;
                align-items: center;
                gap: 12px;
                min-height: 44px;
                padding: 0 12px;
                border-radius: 10px;
                color: #b9c4bf;
                text-decoration: none;
                font-weight: 600;
                font-size: 14px;
              "
              ><svg
                aria-hidden="true"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M3 10l9-6 9 6"></path>
                <path d="M5 10v9"></path>
                <path d="M19 10v9"></path>
                <path d="M9.5 10v9"></path>
                <path d="M14.5 10v9"></path>
                <path d="M3 21h18"></path></svg
              >Contas</a
            >
            <a
              href="Categorias.dc.html"
              aria-current="page"
              style="
                display: flex;
                align-items: center;
                gap: 12px;
                min-height: 44px;
                padding: 0 12px;
                border-radius: 10px;
                background: #1f2e29;
                color: #ffffff;
                text-decoration: none;
                font-weight: 700;
                font-size: 14px;
              "
              ><svg
                aria-hidden="true"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"
                ></path>
                <circle cx="8" cy="8" r="1.5"></circle></svg
              >Categorias</a
            >
          </div>
          <div
            style="
              margin-top: auto;
              display: flex;
              align-items: center;
              gap: 12px;
              padding: 10px 6px 10px 12px;
              border-radius: 12px;
              background: #17241f;
            "
          >
            <div
              aria-hidden="true"
              style="
                width: 36px;
                height: 36px;
                border-radius: 50%;
                background: #2c3d37;
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: 800;
                font-size: 14px;
              "
            >
              R
            </div>
            <a
              href="#"
              style="
                display: flex;
                flex-direction: column;
                flex: 1;
                min-width: 0;
                color: #e7ece9;
                text-decoration: none;
              "
              ><span style="font-size: 14px; font-weight: 700">Renan Caldas</span
              ><span style="font-size: 12px; color: #a7b3ae">Editar perfil</span></a
            >
            <a
              href="Login.dc.html"
              aria-label="Sair"
              style="
                width: 44px;
                height: 44px;
                border-radius: 10px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #b9c4bf;
              "
              ><svg
                aria-hidden="true"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <path d="M16 17l5-5-5-5"></path>
                <path d="M21 12H9"></path></svg
            ></a>
          </div>
        </nav>

        <main
          style="
            flex: 999 1 560px;
            min-width: 0;
            box-sizing: border-box;
            padding: 32px clamp(16px, 3vw, 40px) 48px;
            display: flex;
            flex-direction: column;
            gap: 24px;
          "
        >
          <header
            style="
              display: flex;
              flex-wrap: wrap;
              align-items: center;
              justify-content: space-between;
              gap: 16px;
            "
          >
            <div style="display: flex; flex-direction: column; gap: 4px">
              <span style="font-size: 14px; color: #5b6661; font-weight: 600"
                >Categorias inativas não aparecem ao lançar transações</span
              >
              <h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em">
                Categorias
              </h1>
            </div>
            <div
              role="tablist"
              aria-label="Tipo de categoria"
              style="
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 6px;
                padding: 4px;
                background: #e6e9e7;
                border-radius: 12px;
                min-width: 280px;
              "
            >
              <button
                type="button"
                role="tab"
                aria-selected="{{expenseSelected}}"
                onClick="{{showExpense}}"
                style="{{expenseTabStyle}}"
              >
                Despesas
              </button>
              <button
                type="button"
                role="tab"
                aria-selected="{{incomeSelected}}"
                onClick="{{showIncome}}"
                style="{{incomeTabStyle}}"
              >
                Receitas
              </button>
            </div>
          </header>

          <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
            <section
              aria-label="Lista de categorias"
              style="
                flex: 999 1 520px;
                min-width: 0;
                background: #ffffff;
                border: 1px solid #e2e6e3;
                border-radius: 16px;
                padding: 6px 18px;
              "
            >
              <sc-for list="{{list}}" as="c" hint-placeholder-count="5">
                <div style="{{c.rowStyle}}">
                  <div aria-hidden="true" style="{{c.dotStyle}}"></div>
                  <div style="display: flex; flex-direction: column; flex: 1; min-width: 0">
                    <span style="font-size: 15px; font-weight: 700">{{c.name}}</span>
                    <span style="font-size: 13px; color: #5b6661">{{c.description}}</span>
                  </div>
                  <span style="{{c.statusStyle}}">{{c.statusLabel}}</span>
                  <button
                    type="button"
                    role="switch"
                    aria-checked="{{c.checked}}"
                    aria-label="{{c.switchLabel}}"
                    onClick="{{c.toggle}}"
                    style="
                      width: 52px;
                      height: 44px;
                      border: 0;
                      background: transparent;
                      padding: 0;
                      cursor: pointer;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                    "
                  >
                    <span style="{{c.trackStyle}}"><span style="{{c.knobStyle}}"></span></span>
                  </button>
                  <button
                    type="button"
                    aria-label="Editar categoria"
                    style="
                      width: 44px;
                      height: 44px;
                      border: 0;
                      border-radius: 10px;
                      background: transparent;
                      color: #3f4a45;
                      cursor: pointer;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                    "
                  >
                    <svg
                      aria-hidden="true"
                      width="17"
                      height="17"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M12 20h9"></path>
                      <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path>
                    </svg>
                  </button>
                  <button
                    type="button"
                    aria-label="Excluir categoria"
                    style="
                      width: 44px;
                      height: 44px;
                      border: 0;
                      border-radius: 10px;
                      background: transparent;
                      color: #9a3b0c;
                      cursor: pointer;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                    "
                  >
                    <svg
                      aria-hidden="true"
                      width="17"
                      height="17"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M3 6h18"></path>
                      <path d="M8 6V4h8v2"></path>
                      <path d="M19 6l-1 14H6L5 6"></path>
                    </svg>
                  </button>
                </div>
              </sc-for>
            </section>

            <form
              aria-labelledby="new-cat"
              style="
                flex: 1 1 300px;
                min-width: 0;
                background: #ffffff;
                border: 1px solid #e2e6e3;
                border-radius: 16px;
                padding: 22px;
                display: flex;
                flex-direction: column;
                gap: 16px;
              "
            >
              <h2 id="new-cat" style="margin: 0; font-size: 17px; font-weight: 800">
                Nova categoria
              </h2>
              <label
                style="
                  display: flex;
                  flex-direction: column;
                  gap: 8px;
                  font-size: 13px;
                  font-weight: 700;
                  color: #3f4a45;
                "
                >Nome
                <input
                  type="text"
                  minlength="3"
                  maxlength="255"
                  placeholder="Ex.: Pets"
                  style="
                    min-height: 44px;
                    padding: 0 14px;
                    border: 1px solid #d6dbd8;
                    border-radius: 10px;
                    font: inherit;
                    font-size: 15px;
                    font-weight: 500;
                    color: #0f1a17;
                  "
                />
              </label>
              <label
                style="
                  display: flex;
                  flex-direction: column;
                  gap: 8px;
                  font-size: 13px;
                  font-weight: 700;
                  color: #3f4a45;
                "
                >Tipo
                <select
                  style="
                    min-height: 44px;
                    padding: 0 10px;
                    border: 1px solid #d6dbd8;
                    border-radius: 10px;
                    background: #ffffff;
                    font: inherit;
                    font-size: 15px;
                    font-weight: 500;
                    color: #0f1a17;
                  "
                >
                  <option>Despesa</option>
                  <option>Receita</option>
                </select>
              </label>
              <label
                style="
                  display: flex;
                  flex-direction: column;
                  gap: 8px;
                  font-size: 13px;
                  font-weight: 700;
                  color: #3f4a45;
                "
                >Descrição <span style="font-weight: 500; color: #5b6661">(opcional)</span>
                <textarea
                  rows="3"
                  style="
                    padding: 10px 14px;
                    border: 1px solid #d6dbd8;
                    border-radius: 10px;
                    font: inherit;
                    font-size: 14px;
                    font-weight: 500;
                    color: #0f1a17;
                    resize: none;
                  "
                ></textarea>
              </label>
              <button
                type="submit"
                style="
                  min-height: 46px;
                  border: 0;
                  border-radius: 10px;
                  background: #0b7a5c;
                  color: #ffffff;
                  font: inherit;
                  font-size: 14px;
                  font-weight: 800;
                  cursor: pointer;
                "
              >
                Criar categoria
              </button>
            </form>
          </div>
        </main>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
      class Component extends DCLogic {
        constructor(props) {
          super(props);
          this.state = {
            tab: 'expense',
            inactive: { 'Lazer': false, 'Educação': true, 'Rendimentos': true }
          };
        }
        renderVals() {
          const tab = this.state.tab;
          const cats = {
            expense: [['Moradia', 'Aluguel, condomínio, contas da casa'], ['Alimentação', 'Mercado e restaurantes'], ['Transporte', 'Combustível, apps e transporte público'], ['Saúde', 'Farmácia, plano e academia'], ['Lazer', 'Passeios e assinaturas'], ['Educação', 'Cursos e livros'], ['Transferência (saída)', 'Usada nas transferências entre contas']],
            income: [['Salário', 'Pagamento mensal'], ['Freelance', 'Projetos avulsos'], ['Rendimentos', 'Juros e dividendos'], ['Transferência (entrada)', 'Usada nas transferências entre contas']]
          }[tab];
          const color = tab === 'income' ? '#0B7A5C' : '#C2591C';
          const list = cats.map(([name, description], i) => {
            const off = !!this.state.inactive[name];
            return {
              name, description,
              checked: off ? 'false' : 'true',
              switchLabel: 'Categoria ' + name + ' ativa',
              statusLabel: off ? 'Inativa' : 'Ativa',
              toggle: () => this.setState({ inactive: { ...this.state.inactive, [name]: !off } }),
              rowStyle: 'display: flex; align-items: center; gap: 12px; padding: 12px 0; ' + (i ? 'border-top: 1px solid #F0F2F0; ' : '') + (off ? 'opacity: 0.6' : ''),
              dotStyle: 'width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; background: ' + (off ? '#AEB6B2' : color),
              statusStyle: 'padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: 700; ' + (off ? 'background: #F0F2F0; color: #3F4A45' : 'background: #E3F2EC; color: #0A5F48'),
              trackStyle: 'width: 40px; height: 24px; border-radius: 99px; display: flex; align-items: center; padding: 3px; box-sizing: border-box; justify-content: ' + (off ? 'flex-start' : 'flex-end') + '; background: ' + (off ? '#C9D0CC' : '#0B7A5C'),
              knobStyle: 'width: 18px; height: 18px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.2)'
            };
          });
          const tabStyle = (on) => 'min-height: 44px; border: 0; border-radius: 9px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; ' + (on ? 'background: #FFFFFF; color: #0F1A17; box-shadow: 0 1px 3px rgba(15,26,23,0.15)' : 'background: transparent; color: #3F4A45');
          return {
            list,
            expenseSelected: tab === 'expense' ? 'true' : 'false',
            incomeSelected: tab === 'income' ? 'true' : 'false',
            expenseTabStyle: tabStyle(tab === 'expense'),
            incomeTabStyle: tabStyle(tab === 'income'),
            showExpense: () => this.setState({ tab: 'expense' }),
            showIncome: () => this.setState({ tab: 'income' })
          };
        }
      }
    </script>
  </body>
</html>

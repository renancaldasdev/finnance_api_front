<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Finannce — Nova transação</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
      }
      a {
        color: #0b6b51;
      }
      a:hover {
        color: #08513d;
      }
    </style>
  </head>
  <body>
    <div
      role="dialog"
      aria-labelledby="nt-title"
      style="
        width: 560px;
        height: 720px;
        box-sizing: border-box;
        background: #ffffff;
        border-radius: 20px;
        padding: 28px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        font-family: Manrope, system-ui, sans-serif;
        color: #0f1a17;
        font-variant-numeric: tabular-nums;
      "
    >
      <div style="display: flex; justify-content: space-between; align-items: center">
        <h2
          id="nt-title"
          style="margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.01em"
        >
          Nova transação
        </h2>
        <a
          href="01-dashboard.html"
          aria-label="Fechar"
          style="
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #3f4a45;
            text-decoration: none;
          "
          ><svg
            aria-hidden="true"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <path d="M6 6l12 12"></path>
            <path d="M18 6L6 18"></path></svg
        ></a>
      </div>

      <div
        role="radiogroup"
        aria-label="Tipo"
        style="
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 6px;
          padding: 4px;
          background: #f0f2f0;
          border-radius: 12px;
        "
      >
        <button
          type="button"
          role="radio"
          aria-checked="true"
          onclick=""
          style="
            min-height: 44px;
            border: 0;
            border-radius: 9px;
            font: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            background: #ffffff;
            color: #b4470f;
            box-shadow: 0 1px 3px rgba(15, 26, 23, 0.15);
          "
        >
          Despesa
        </button>

        <button
          type="button"
          role="radio"
          aria-checked="false"
          onclick=""
          style="
            min-height: 44px;
            border: 0;
            border-radius: 9px;
            font: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            background: transparent;
            color: #3f4a45;
          "
        >
          Receita
        </button>

        <button
          type="button"
          role="radio"
          aria-checked="false"
          onclick=""
          style="
            min-height: 44px;
            border: 0;
            border-radius: 9px;
            font: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            background: transparent;
            color: #3f4a45;
          "
        >
          Transferência
        </button>
      </div>

      <label
        style="
          display: flex;
          flex-direction: column;
          gap: 8px;
          font-size: 13px;
          font-weight: 700;
          color: #3f4a45;
        "
        >Valor
        <span
          style="
            display: flex;
            align-items: baseline;
            gap: 8px;
            padding: 10px 14px;
            border: 1.5px solid #d6dbd8;
            border-radius: 12px;
          "
        >
          <span style="font-size: 20px; font-weight: 700; color: #5b6661">R$</span>
          <input
            type="text"
            inputmode="decimal"
            placeholder="0,00"
            style="
              border: 0;
              outline: none;
              font: inherit;
              font-size: 32px;
              font-weight: 800;
              width: 100%;
              min-width: 0;
              background: transparent;
              color: #b4470f;
            "
          />
        </span>
      </label>

      <label
        style="
          display: flex;
          flex-direction: column;
          gap: 8px;
          font-size: 13px;
          font-weight: 700;
          color: #3f4a45;
        "
        >Descrição
        <span style="font-weight: 500; color: #5b6661">(opcional, até 255 caracteres)</span>
        <input
          type="text"
          maxlength="255"
          placeholder="Ex.: Supermercado"
          style="
            min-height: 44px;
            padding: 0 14px;
            border: 1px solid #d6dbd8;
            border-radius: 10px;
            font: inherit;
            font-size: 15px;
            font-weight: 500;
            color: #0f1a17;
          "
        />
      </label>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <label
          style="
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 13px;
            font-weight: 700;
            color: #3f4a45;
          "
          >Categoria
          <select
            style="
              min-height: 44px;
              padding: 0 10px;
              border: 1px solid #d6dbd8;
              border-radius: 10px;
              background: #ffffff;
              font: inherit;
              font-size: 15px;
              font-weight: 500;
              color: #0f1a17;
            "
          >
            <option>Alimentação</option>
            <option>Moradia</option>
            <option>Transporte</option>
            <option>Lazer</option>
            <option>Saúde</option>
          </select>
        </label>
        <label
          style="
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 13px;
            font-weight: 700;
            color: #3f4a45;
          "
          >Conta
          <select
            style="
              min-height: 44px;
              padding: 0 10px;
              border: 1px solid #d6dbd8;
              border-radius: 10px;
              background: #ffffff;
              font: inherit;
              font-size: 15px;
              font-weight: 500;
              color: #0f1a17;
            "
          >
            <option>Nubank</option>
            <option>Itaú</option>
            <option>Reserva CDB</option>
          </select>
        </label>
      </div>
      <label
        style="
          display: flex;
          align-items: center;
          gap: 12px;
          min-height: 44px;
          font-size: 14px;
          font-weight: 600;
          cursor: pointer;
        "
      >
        <input
          type="checkbox"
          checked=""
          style="width: 20px; height: 20px; accent-color: #0b7a5c"
        />
        Já foi pago
      </label>

      <label
        style="
          display: flex;
          flex-direction: column;
          gap: 8px;
          font-size: 13px;
          font-weight: 700;
          color: #3f4a45;
        "
        >Data
        <input
          type="date"
          value="2026-11-02"
          style="
            min-height: 44px;
            padding: 0 10px;
            border: 1px solid #d6dbd8;
            border-radius: 10px;
            font: inherit;
            font-size: 15px;
            font-weight: 500;
            color: #0f1a17;
          "
        />
      </label>

      <div style="margin-top: auto; display: flex; gap: 10px; justify-content: flex-end">
        <a
          href="01-dashboard.html"
          style="
            display: flex;
            align-items: center;
            min-height: 44px;
            padding: 0 18px;
            border: 1px solid #d6dbd8;
            border-radius: 10px;
            color: #0f1a17;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
          "
          >Cancelar</a
        >
        <a
          href="02-transactions.html"
          style="
            display: flex;
            align-items: center;
            min-height: 44px;
            padding: 0 22px;
            border-radius: 10px;
            background: #0b7a5c;
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
          "
          >Salvar transação</a
        >
      </div>
    </div>
  </body>
</html>
